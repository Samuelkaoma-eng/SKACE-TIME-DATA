# Serves the static results site written by scripts/build_results_site.py.
# Port 8080 because the unprivileged nginx image cannot bind below 1024.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/csv application/json;
    gzip_min_length 1024;

    # A location that sets its own add_header drops the server-level ones, so
    # these two are repeated wherever a location adds a header.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Status, data mode and commit, for Dokploy and for checking a deploy.
    location = /health {
        default_type application/json;
        try_files /health.json =404;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # The page changes on every deploy; the CSVs are named per run.
    location = /index.html {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location /runs/ {
        types { text/csv csv; application/json json; }
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
