name: CI

# Runs on every push and pull request. Installs from requirements.txt on a clean
# runner, runs the test suite, and executes the pipeline end to end on the sample
# data, so that a fresh-environment failure is caught here rather than by an
# examiner on their own machine.
#
# The matrix covers both pandas 2 and pandas 3 deliberately. A pandas 3 change to
# datetime resolution silently broke ODK duration conversion during development
# and was only found during a manual clean-environment audit. This guards it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.12, pandas 2
            python-version: "3.12"
            pandas-spec: "pandas>=2.0,<3.0"
          - name: Python 3.14, pandas 3
            python-version: "3.14"
            pandas-spec: "pandas>=3.0"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "${{ matrix.pandas-spec }}"

      - name: Record the environment
        run: |
          python -c "import sys, pandas, numpy, scipy; print('python', sys.version.split()[0]); print('pandas', pandas.__version__); print('numpy', numpy.__version__); print('scipy', scipy.__version__)"

      - name: Run the test suite
        run: python -m pytest -v

      - name: Run the pipeline end to end, SurveyCTO format
        run: python run_pipeline.py --inputs data/surveycto.csv --output-dir ci_output --label ci_surveycto

      - name: Run the pipeline end to end, ODK format
        run: python run_pipeline.py --inputs data/odk.csv --output-dir ci_output --label ci_odk

      - name: Run the pipeline end to end, both formats in one batch
        run: python run_pipeline.py --inputs data/odk.csv data/surveycto.csv --output-dir ci_output --label ci

      - name: Check the pipeline actually produced its outputs
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          expected = [
              f"{kind}_{label}.csv"
              for label in ("ci_surveycto", "ci_odk", "ci")
              for kind in (
                  "question_features",
                  "section_features",
                  "feature_dataset",
                  "anomaly_report",
                  "pipeline_output",
              )
          ]
          out = Path("ci_output")
          missing = [name for name in expected if not (out / name).is_file()]
          if missing:
              print("Missing expected outputs:", ", ".join(missing))
              sys.exit(1)

          empty = [name for name in expected if (out / name).stat().st_size == 0]
          if empty:
              print("Empty outputs:", ", ".join(empty))
              sys.exit(1)

          import pandas as pd

          for label in ("ci_surveycto", "ci_odk", "ci"):
              features = pd.read_csv(out / f"feature_dataset_{label}.csv")
              if features.empty:
                  print(f"Feature dataset {label} has no rows")
                  sys.exit(1)
              fam = {f: sum(1 for c in features.columns if c.startswith(f"{f}-")) for f in "QSVT"}
              if any(v != 10 for v in fam.values()):
                  print(f"{label}: expected 10 features per family, got {fam}")
                  sys.exit(1)
              print(f"{label}: {len(features)} interviews, families {fam}")
          PY

      - name: Upload the pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-py${{ matrix.python-version }}
          path: ci_output/
          if-no-files-found: warn
          retention-days: 14
